<html lang="ko">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI 트렌드 리포트</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hahmlet:wght@600&family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+KR:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #10131c;
    --surface: #171b28;
    --surface-2: #1d2231;
    --border: #2a3046;
    --fg: #eef0f7;
    --muted: #98a1ba;
    --muted-2: #7c859e;
    --accent: #f2a154;
    --accent-soft: rgba(242,161,84,.14);
    --accent-2: #6fd6c4;
    --accent-2-soft: rgba(111,214,196,.14);
    --streak: #e8609a;
    --font-sans: "Public Sans", "IBM Plex Sans KR", -apple-system, sans-serif;
    --font-mono: "IBM Plex Mono", "IBM Plex Sans KR", monospace;
    --font-display: "Hahmlet", serif;
    color-scheme: dark;
  }
  /* spacing steps: 4 · 8 · 12 · 16 · 24 · 32 · 48 */
  * { box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: var(--font-sans);
    word-break: keep-all;
    overflow-wrap: anywhere;
    margin: 0;
    padding-inline: 16px;
    padding-block: 40px 64px;
  }
  ::selection { background: color-mix(in srgb, var(--accent) 32%, transparent); }
  a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 3px; }
  .wrap { max-width: 680px; margin: 0 auto; }
  .sr {
    position: absolute;
    width: 1px;
    height: 1px;
    overflow: hidden;
    clip-path: inset(50%);
    white-space: nowrap;
  }

  h1 {
    font-family: var(--font-display);
    font-weight: 600;
    font-size: clamp(28px, 6vw, 40px);
    line-height: 1.08;
    margin: 0 0 8px;
    text-wrap: balance;
  }
  .meta {
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: .12em;
    text-transform: uppercase;
    color: var(--muted-2);
    display: flex;
    gap: 8px;
    align-items: center;
    flex-wrap: wrap;
    margin: 0;
  }
  .meta .dot { width: 5px; height: 5px; border-radius: 50%; background: var(--accent); }
  .sub {
    color: var(--muted);
    font-size: 14.5px;
    line-height: 1.6;
    max-width: 56ch;
    margin: 12px 0 0;
  }
  .sub a { color: var(--fg); text-decoration-color: var(--border); text-underline-offset: 3px; }
  .sub a:hover { text-decoration-color: var(--accent); }

  .tabs {
    display: flex;
    gap: 4px;
    margin-top: 32px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 4px;
    width: fit-content;
  }
  .tab {
    appearance: none;
    border: 1px solid transparent;
    background: transparent;
    color: var(--muted);
    font-family: var(--font-sans);
    font-size: 13.5px;
    font-weight: 600;
    min-height: 36px;
    padding: 0 14px;
    border-radius: 7px;
    cursor: pointer;
  }
  .tab:hover { color: var(--fg); }
  .tab[aria-selected="true"] { background: var(--surface-2); color: var(--fg); border-color: var(--muted-2); }
  .tab:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .tab .count {
    font-family: var(--font-mono);
    font-variant-numeric: tabular-nums;
    font-size: 12.5px;
    font-weight: 500;
    margin-left: 4px;
  }

  .list[hidden] { display: none; }
  .group h2 {
    display: flex;
    flex-wrap: wrap;
    align-items: baseline;
    gap: 2px 8px;
    font-size: 17px;
    font-weight: 700;
    margin: 36px 0 0;
  }
  .group:first-child h2 { margin-top: 24px; }
  .group h2 .hint { font-size: 12.5px; font-weight: 400; color: var(--muted-2); }
  .rows { list-style: none; margin: 0; padding: 0; }
  .row {
    display: grid;
    grid-template-columns: 44px 1fr auto;
    gap: 4px 16px;
    align-items: start;
    padding: 12px 4px;
    border-bottom: 1px solid var(--border);
  }
  .row:last-child { border-bottom: none; }

  .mark {
    font-family: var(--font-mono);
    font-variant-numeric: tabular-nums;
    font-weight: 600;
    white-space: nowrap;
  }
  .mark.streak { color: var(--streak); font-size: 17px; line-height: 1.15; }
  .mark.streak .u { font-size: 11px; margin-left: 1px; }
  .mark.new { color: var(--accent); font-size: 10.5px; letter-spacing: .08em; padding-top: 4px; }
  [data-period="weekly"] .mark.new { color: var(--accent-2); }

  .main { min-width: 0; }
  .name-line { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
  .name {
    font-weight: 700;
    font-size: 15.5px;
    color: var(--fg);
    text-decoration: none;
  }
  .name:hover { color: var(--accent); }
  .name .owner { color: var(--muted); font-weight: 500; }
  .lang {
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--muted);
    border: 1px solid var(--border);
    border-radius: 5px;
    padding: 1px 6px;
    white-space: nowrap;
  }
  .desc {
    color: var(--muted);
    font-size: 13.5px;
    line-height: 1.55;
    margin-top: 4px;
    max-width: 60ch;
  }

  .metric { text-align: right; min-width: 108px; }
  .stars {
    font-family: var(--font-mono);
    font-variant-numeric: tabular-nums;
    font-size: 14px;
    font-weight: 600;
  }
  .delta {
    font-family: var(--font-mono);
    font-variant-numeric: tabular-nums;
    font-size: 12px;
    color: var(--accent);
    margin-top: 4px;
  }
  [data-period="weekly"] .delta { color: var(--accent-2); }
  .metric .k {
    font-family: var(--font-sans);
    font-size: 11.5px;
    font-weight: 400;
    color: var(--muted);
    margin-right: 4px;
  }

  .empty { color: var(--muted); font-size: 14px; padding: 24px 4px; margin: 0; }

  details.excluded {
    margin-top: 36px;
    border: 1px dashed var(--border);
    border-radius: 10px;
    padding: 0 14px;
  }
  details.excluded summary {
    cursor: pointer;
    font-size: 13px;
    color: var(--muted);
    font-weight: 600;
    line-height: 20px;
    padding: 12px 0;
  }
  details.excluded summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  details.excluded p {
    font-size: 13px;
    color: var(--muted-2);
    line-height: 1.6;
    margin: 0 0 12px;
  }
  .foot {
    font-size: 12.5px;
    color: var(--muted-2);
    line-height: 1.6;
    margin: 12px 0 0;
  }

  @media (pointer: coarse) {
    .tab { min-height: 44px; }
    .name { padding-block: 13px; margin-block: -13px; }
  }
  @media (max-width: 480px) {
    .row { grid-template-columns: 44px 1fr; column-gap: 12px; padding-inline: 0; }
    .metric { grid-column: 2; text-align: left; min-width: 0; display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
    .delta { margin-top: 0; }
  }
</style>

<main class="wrap">
  <h1>AI 트렌드 리포트</h1>
  <p class="meta"><span class="dot"></span>2026-10-28 · GITHUB TRENDING · AI ONLY</p>
  <p class="sub">
    <a href="https://github.com/trending?since=daily">GitHub 트렌딩 Daily</a>(11개)와
    <a href="https://github.com/trending?since=weekly">Weekly</a>(13개)에서 AI 관련 저장소만 추렸습니다.
    별 수는 조회 시점 값입니다.
  </p>

  <div class="tabs" role="tablist" aria-label="기간">
    <button class="tab" id="tab-daily" role="tab" aria-selected="true" aria-controls="panel-daily">Daily<span class="count">10</span></button>
    <button class="tab" id="tab-weekly" role="tab" aria-selected="false" aria-controls="panel-weekly" tabindex="-1">Weekly<span class="count">12</span></button>
  </div>

  <div class="list" id="panel-daily" role="tabpanel" aria-labelledby="tab-daily" data-period="daily"></div>
  <div class="list" id="panel-weekly" role="tabpanel" aria-labelledby="tab-weekly" data-period="weekly" hidden></div>

  <details class="excluded">
    <summary>제외한 저장소 (Daily 1개 · Weekly 1개)</summary>
    <p>AI 자체를 다루는 프로젝트가 아니라 제외했습니다.</p>
    <p><b>Daily</b> — gitroomhq/postiz-app(SNS 예약 도구)<br>
    <b>Weekly</b> — fastapi/fastapi(파이썬 웹 프레임워크)</p>
  </details>
  <p class="foot" id="foot"></p>
</main>

<script>

    { owner: "HKUDS", repo: "DeepTutor", lang: "Python", stars: 45862, delta: 1598, streak: 0,
      desc: "평생 함께하는 개인 맞춤형 AI 튜터 — 학습자에 맞춰 가르치는 튜터링 시스템" },
    { owner: "JetBrains", repo: "thinkrail", lang: "TypeScript", stars: 3988, delta: 1204, streak: 2,
      desc: "pi 코딩 에이전트로 바이브 코딩하는 가벼운 진짜 IDE — 사용자의 작업 방식에 맞춰 스스로 바뀜" },
    { owner: "togg53192-cmd", repo: "jailbreaks", lang: "-", stars: 5516, delta: 902, streak: 0,
      desc: "LLM 탈옥 프롬프트 모음 — Claude·Gemini·GLM·DeepSeek 등 25종 이상 모델을 겨냥한 시스템 프롬프트·페르소나·AGENTS.md 31개, 연구·교육용 표방" }
  ];

  const weekly = [
    { owner: "cloudflare", repo: "security-audit-skill", lang: "JavaScript", stars: 50174, delta: 16388, streak: 6,
      desc: "여러 단계로 보안 감사를 수행하는 코딩 에이전트 스킬 — 발견한 문제를 독립적으로 검증하고 기계가 읽을 수 있는 형식으로 출력" },
    { owner: "anthropics", repo: "knowledge-work-plugins", lang: "Python", stars: 33427, delta: 2789, streak: 4,
      desc: "지식 노동자가 Claude Cowork에서 쓰도록 만든 오픈소스 플러그인 저장소 — 업무용 플러그인 모음" },
    { owner: "AgriciDaniel", repo: "claude-seo", lang: "Python", stars: 22744, delta: 3081, streak: 2,
      desc: "Claude Code용 범용 SEO 스킬 — 하위 스킬 26개·서브에이전트 19개로 기술 SEO, E-E-A-T, 스키마, GEO/AEO, 에이전트 대응(WebMCP, llms.txt), 백링크·로컬·국제 SEO와 PDF/Excel 보고서까지 다룸" },
    { owner: "multica-ai", repo: "andrej-karpathy-skills", lang: "-", stars: 225492, delta: 4039, streak: 2,
      desc: "Claude Code의 동작을 개선하는 CLAUDE.md 파일 하나 — Andrej Karpathy가 짚은 LLM 코딩 함정에서 도출" },
    { owner: "TauricResearch", repo: "TradingAgents", lang: "Python", stars: 117318, delta: 4882, streak: 2,
      desc: "여러 LLM 에이전트로 금융 트레이딩을 수행하는 프레임워크 — 멀티 에이전트 협업 구조" },
    { owner: "Graphify-Labs", repo: "graphify", lang: "Python", stars: 136976, delta: 7268, streak: 5,
      desc: "코드베이스와 문서·SQL 스키마·설정·PDF를 질의 가능한 지식 그래프로 변환 — Claude Code·Cursor·Codex·Gemini CLI용 /graphify 스킬, 로컬 AST 파싱으로 모든 연결에 근거를 달고 벡터 저장소 없이 동작" },
    { owner: "ruvnet", repo: "ruflo", lang: "TypeScript", stars: 79793, delta: 2296, streak: 8,
      desc: "원조 에이전트 하네스 — 멀티 에이전트 스웜 배포와 자율 워크플로 조율, 적응형 메모리·자기 학습·벡터 RAG를 갖추고 Claude Code·Codex·Hermes 등과 기본 연동" },
    { owner: "anomalyco", repo: "opencode", lang: "TypeScript", stars: 222378, delta: 4334, streak: 7,
      desc: "오픈소스 코딩 에이전트 — 터미널에서 쓰는 AI 코딩 도구" },
    { owner: "stablyai", repo: "orca", lang: "TypeScript", stars: 108066, delta: 8802, streak: 7,
      desc: "여러 코딩 에이전트(Grok Bot, Claude Code 등)를 한곳에서 함께 다루는 작업 공간 — 내 구독으로 어떤 코딩 에이전트든 실행, 데스크톱·모바일·원격 런타임 지원" },
    { owner: "android", repo: "skills", lang: "Kotlin", stars: 9914, delta: 873, streak: 6,
      desc: "AI 코딩 에이전트에게 Android 개발 모범 사례를 가르치는 공식 스킬 모음 — Android CLI나 Claude Code·Codex 플러그인으로 설치" },
    { owner: "akitaonrails", repo: "ai-memory", lang: "Rust", stars: 14079, delta: 2239, streak: 6,
      desc: "코딩 에이전트 CLI용 장기 기억 솔루션 — 서로 다른 에이전트 제품 간 작업 인계를 도와줌" },
    { owner: "pingdotgg", repo: "t3code", lang: "TypeScript", stars: 30836, delta: 1988, streak: 2,
      desc: "내 컴퓨터의 코딩 에이전트를 조종하는 에이전트 하네스 제어판 — Claude Code·Codex·Cursor·OpenCode 등 기존 구독을 모바일·웹·데스크톱 앱에서 제어" }
  ];

  const prev = "10-02 · 10-07 · 10-08 · 10-12 · 10-13 · 10-14 · 10-15 · 10-16 · 10-19 · 10-20 · 10-21 · 10-22 · 10-23 · 10-26 · 10-27";
  const prevDates = prev === "없음" ? [] : prev.split(" · ");
  const prevN = prevDates.length;
  document.getElementById("foot").textContent = prevN
    ? "비교한 이전 리포트 " + prevN + "개 (" + prevDates[0] + (prevN > 1 ? " ~ " + prevDates[prevN - 1] : "") + ")"
    : "비교한 이전 리포트 없음";

  function fmt(n) { return n.toLocaleString("en-US"); }
  function esc(s) {
    return String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
  }

  function row(item, period) {
    const url = "https://github.com/" + item.owner + "/" + item.repo;
    const mark = item.streak > 0
      ? '<div class="mark streak"><span aria-hidden="true">' + item.streak + '<span class="u">회</span></span>' +
        '<span class="sr">이전 ' + item.streak + '회 등장</span></div>'
      : '<div class="mark new"><span aria-hidden="true">NEW</span><span class="sr">처음 등장</span></div>';
    const lang = item.lang === "-" ? "" : '<span class="lang">' + esc(item.lang) + '</span>';
    return (
      '<li class="row">' +
        mark +
        '<div class="main">' +
          '<div class="name-line">' +
            '<a class="name" href="' + esc(url) + '">' +
              '<span class="owner">' + esc(item.owner) + '/</span>' + esc(item.repo) +
            '</a>' +
            lang +
          '</div>' +
          '<div class="desc">' + esc(item.desc) + '</div>' +
        '</div>' +
        '<div class="metric">' +
          '<div class="stars"><span class="k">전체</span>' + fmt(item.stars) + '</div>' +
          '<div class="delta"><span class="k">' + (period === "daily" ? "오늘" : "이번 주") + '</span>+' + fmt(item.delta) + '</div>' +
        '</div>' +
      '</li>'
    );
  }

  function group(title, hint, items, period) {
    if (!items.length) return "";
    return (
      '<section class="group">' +
        '<h2>' + title + '<span class="hint">' + hint + '</span></h2>' +
        '<ol class="rows">' + items.map(item => row(item, period)).join("") + '</ol>' +
      '</section>'
    );
  }

  function renderList(el, items, period) {
    if (!items.length) {
      el.innerHTML = '<p class="empty">' + (period === "daily" ? "오늘은" : "이번 주는") + ' AI 관련 저장소가 없습니다.</p>';
      return;
    }
    // sort is stable, so ties keep GitHub's order
    const fresh = items.filter(item => item.streak === 0);
    const repeat = items.filter(item => item.streak > 0).sort((a, b) => b.streak - a.streak);
    el.innerHTML =
      group("처음 등장", "이전 리포트에 없던 저장소", fresh, period) +
      group("계속 뜨는 중", "숫자는 이전 리포트 " + prevN + "개 중 등장한 횟수", repeat, period);
  }

  renderList(document.getElementById("panel-daily"), daily, "daily");
  renderList(document.getElementById("panel-weekly"), weekly, "weekly");

  const tabs = [document.getElementById("tab-daily"), document.getElementById("tab-weekly")];
  const panels = [document.getElementById("panel-daily"), document.getElementById("panel-weekly")];

  function selectTab(i, focus) {
    tabs.forEach((tab, j) => {
      tab.setAttribute("aria-selected", String(i === j));
      tab.tabIndex = i === j ? 0 : -1;
      panels[j].hidden = i !== j;
    });
    if (focus) tabs[i].focus();
  }
  tabs.forEach((tab, i) => {
    tab.addEventListener("click", () => selectTab(i));
    tab.addEventListener("keydown", e => {
      const to = { ArrowRight: i + 1, ArrowLeft: i - 1, Home: 0, End: tabs.length - 1 }[e.key];
      if (to === undefined) return;
      e.preventDefault();
      selectTab((to + tabs.length) % tabs.length, true);
    });
  });
</script>
