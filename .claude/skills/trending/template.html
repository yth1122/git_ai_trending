<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI 트렌드 리포트</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hahmlet:wght@600&family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+KR:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #10131c;
    --surface: #171b28;
    --surface-2: #1d2231;
    --border: #2a3046;
    --fg: #eef0f7;
    --muted: #98a1ba;
    --muted-2: #7c859e;
    --accent: #f2a154;
    --accent-soft: rgba(242,161,84,.14);
    --accent-2: #6fd6c4;
    --accent-2-soft: rgba(111,214,196,.14);
    --streak: #e8609a;
    --font-sans: "Public Sans", "IBM Plex Sans KR", -apple-system, sans-serif;
    --font-mono: "IBM Plex Mono", "IBM Plex Sans KR", monospace;
    --font-display: "Hahmlet", serif;
    color-scheme: dark;
  }
  /* spacing steps: 4 · 8 · 12 · 16 · 24 · 32 · 48 */
  * { box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: var(--font-sans);
    word-break: keep-all;
    overflow-wrap: anywhere;
    margin: 0;
    padding-inline: 16px;
    padding-block: 40px 64px;
  }
  ::selection { background: color-mix(in srgb, var(--accent) 32%, transparent); }
  a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 3px; }
  .wrap { max-width: 680px; margin: 0 auto; }
  .sr {
    position: absolute;
    width: 1px;
    height: 1px;
    overflow: hidden;
    clip-path: inset(50%);
    white-space: nowrap;
  }

  h1 {
    font-family: var(--font-display);
    font-weight: 600;
    font-size: clamp(28px, 6vw, 40px);
    line-height: 1.08;
    margin: 0 0 8px;
    text-wrap: balance;
  }
  .meta {
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: .12em;
    text-transform: uppercase;
    color: var(--muted-2);
    display: flex;
    gap: 8px;
    align-items: center;
    flex-wrap: wrap;
    margin: 0;
  }
  .meta .dot { width: 5px; height: 5px; border-radius: 50%; background: var(--accent); }
  .sub {
    color: var(--muted);
    font-size: 14.5px;
    line-height: 1.6;
    max-width: 56ch;
    margin: 12px 0 0;
  }
  .sub a { color: var(--fg); text-decoration-color: var(--border); text-underline-offset: 3px; }
  .sub a:hover { text-decoration-color: var(--accent); }

  .tabs {
    display: flex;
    gap: 4px;
    margin-top: 32px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 4px;
    width: fit-content;
  }
  .tab {
    appearance: none;
    border: 1px solid transparent;
    background: transparent;
    color: var(--muted);
    font-family: var(--font-sans);
    font-size: 13.5px;
    font-weight: 600;
    min-height: 36px;
    padding: 0 14px;
    border-radius: 7px;
    cursor: pointer;
  }
  .tab:hover { color: var(--fg); }
  .tab[aria-selected="true"] { background: var(--surface-2); color: var(--fg); border-color: var(--muted-2); }
  .tab:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .tab .count {
    font-family: var(--font-mono);
    font-variant-numeric: tabular-nums;
    font-size: 12.5px;
    font-weight: 500;
    margin-left: 4px;
  }

  .list[hidden] { display: none; }
  .group h2 {
    display: flex;
    flex-wrap: wrap;
    align-items: baseline;
    gap: 2px 8px;
    font-size: 17px;
    font-weight: 700;
    margin: 36px 0 0;
  }
  .group:first-child h2 { margin-top: 24px; }
  .group h2 .hint { font-size: 12.5px; font-weight: 400; color: var(--muted-2); }
  .rows { list-style: none; margin: 0; padding: 0; }
  .row {
    display: grid;
    grid-template-columns: 44px 1fr auto;
    gap: 4px 16px;
    align-items: start;
    padding: 12px 4px;
    border-bottom: 1px solid var(--border);
  }
  .row:last-child { border-bottom: none; }

  .mark {
    font-family: var(--font-mono);
    font-variant-numeric: tabular-nums;
    font-weight: 600;
    white-space: nowrap;
  }
  .mark.streak { color: var(--streak); font-size: 17px; line-height: 1.15; }
  .mark.streak .u { font-size: 11px; margin-left: 1px; }
  .mark.new { color: var(--accent); font-size: 10.5px; letter-spacing: .08em; padding-top: 4px; }
  [data-period="weekly"] .mark.new { color: var(--accent-2); }

  .main { min-width: 0; }
  .name-line { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
  .name {
    font-weight: 700;
    font-size: 15.5px;
    color: var(--fg);
    text-decoration: none;
  }
  .name:hover { color: var(--accent); }
  .name .owner { color: var(--muted); font-weight: 500; }
  .lang {
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--muted);
    border: 1px solid var(--border);
    border-radius: 5px;
    padding: 1px 6px;
    white-space: nowrap;
  }
  .desc {
    color: var(--muted);
    font-size: 13.5px;
    line-height: 1.55;
    margin-top: 4px;
    max-width: 60ch;
  }

  .metric { text-align: right; min-width: 108px; }
  .stars {
    font-family: var(--font-mono);
    font-variant-numeric: tabular-nums;
    font-size: 14px;
    font-weight: 600;
  }
  .delta {
    font-family: var(--font-mono);
    font-variant-numeric: tabular-nums;
    font-size: 12px;
    color: var(--accent);
    margin-top: 4px;
  }
  [data-period="weekly"] .delta { color: var(--accent-2); }
  .metric .k {
    font-family: var(--font-sans);
    font-size: 11.5px;
    font-weight: 400;
    color: var(--muted);
    margin-right: 4px;
  }

  .empty { color: var(--muted); font-size: 14px; padding: 24px 4px; margin: 0; }

  details.excluded {
    margin-top: 36px;
    border: 1px dashed var(--border);
    border-radius: 10px;
    padding: 0 14px;
  }
  details.excluded summary {
    cursor: pointer;
    font-size: 13px;
    color: var(--muted);
    font-weight: 600;
    line-height: 20px;
    padding: 12px 0;
  }
  details.excluded summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  details.excluded p {
    font-size: 13px;
    color: var(--muted-2);
    line-height: 1.6;
    margin: 0 0 12px;
  }
  .foot {
    font-size: 12.5px;
    color: var(--muted-2);
    line-height: 1.6;
    margin: 12px 0 0;
  }

  @media (pointer: coarse) {
    .tab { min-height: 44px; }
    .name { padding-block: 13px; margin-block: -13px; }
  }
  @media (max-width: 480px) {
    .row { grid-template-columns: 44px 1fr; column-gap: 12px; padding-inline: 0; }
    .metric { grid-column: 2; text-align: left; min-width: 0; display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
    .delta { margin-top: 0; }
  }
</style>

<main class="wrap">
  <h1>AI 트렌드 리포트</h1>
  <p class="meta"><span class="dot"></span>__DATE__ · GITHUB TRENDING · AI ONLY</p>
  <p class="sub">
    <a href="https://github.com/trending?since=daily">GitHub 트렌딩 Daily</a>(__DAILY_TOTAL__개)와
    <a href="https://github.com/trending?since=weekly">Weekly</a>(__WEEKLY_TOTAL__개)에서 AI 관련 저장소만 추렸습니다.
    별 수는 조회 시점 값입니다.
  </p>

  <div class="tabs" role="tablist" aria-label="기간">
    <button class="tab" id="tab-daily" role="tab" aria-selected="true" aria-controls="panel-daily">Daily<span class="count">__DAILY_AI__</span></button>
    <button class="tab" id="tab-weekly" role="tab" aria-selected="false" aria-controls="panel-weekly" tabindex="-1">Weekly<span class="count">__WEEKLY_AI__</span></button>
  </div>

  <div class="list" id="panel-daily" role="tabpanel" aria-labelledby="tab-daily" data-period="daily"></div>
  <div class="list" id="panel-weekly" role="tabpanel" aria-labelledby="tab-weekly" data-period="weekly" hidden></div>

  <details class="excluded">
    <summary>제외한 저장소 (Daily __EX_DAILY_N__개 · Weekly __EX_WEEKLY_N__개)</summary>
    <p>AI 자체를 다루는 프로젝트가 아니라 제외했습니다.</p>
    <p><b>Daily</b> — __EX_DAILY__<br>
    <b>Weekly</b> — __EX_WEEKLY__</p>
  </details>
  <p class="foot" id="foot"></p>
</main>

<script>
  const daily = __DAILY__;

  const weekly = __WEEKLY__;

  const prev = "__PREV__";
  const prevDates = prev === "없음" ? [] : prev.split(" · ");
  const prevN = prevDates.length;
  document.getElementById("foot").textContent = prevN
    ? "비교한 이전 리포트 " + prevN + "개 (" + prevDates[0] + (prevN > 1 ? " ~ " + prevDates[prevN - 1] : "") + ")"
    : "비교한 이전 리포트 없음";

  function fmt(n) { return n.toLocaleString("en-US"); }
  function esc(s) {
    return String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
  }

  function row(item, period) {
    const url = "https://github.com/" + item.owner + "/" + item.repo;
    const mark = item.streak > 0
      ? '<div class="mark streak"><span aria-hidden="true">' + item.streak + '<span class="u">회</span></span>' +
        '<span class="sr">이전 ' + item.streak + '회 등장</span></div>'
      : '<div class="mark new"><span aria-hidden="true">NEW</span><span class="sr">처음 등장</span></div>';
    const lang = item.lang === "-" ? "" : '<span class="lang">' + esc(item.lang) + '</span>';
    return (
      '<li class="row">' +
        mark +
        '<div class="main">' +
          '<div class="name-line">' +
            '<a class="name" href="' + esc(url) + '">' +
              '<span class="owner">' + esc(item.owner) + '/</span>' + esc(item.repo) +
            '</a>' +
            lang +
          '</div>' +
          '<div class="desc">' + esc(item.desc) + '</div>' +
        '</div>' +
        '<div class="metric">' +
          '<div class="stars"><span class="k">전체</span>' + fmt(item.stars) + '</div>' +
          '<div class="delta"><span class="k">' + (period === "daily" ? "오늘" : "이번 주") + '</span>+' + fmt(item.delta) + '</div>' +
        '</div>' +
      '</li>'
    );
  }

  function group(title, hint, items, period) {
    if (!items.length) return "";
    return (
      '<section class="group">' +
        '<h2>' + title + '<span class="hint">' + hint + '</span></h2>' +
        '<ol class="rows">' + items.map(item => row(item, period)).join("") + '</ol>' +
      '</section>'
    );
  }

  function renderList(el, items, period) {
    if (!items.length) {
      el.innerHTML = '<p class="empty">' + (period === "daily" ? "오늘은" : "이번 주는") + ' AI 관련 저장소가 없습니다.</p>';
      return;
    }
    // sort is stable, so ties keep GitHub's order
    const fresh = items.filter(item => item.streak === 0);
    const repeat = items.filter(item => item.streak > 0).sort((a, b) => b.streak - a.streak);
    el.innerHTML =
      group("처음 등장", "이전 리포트에 없던 저장소", fresh, period) +
      group("계속 뜨는 중", "숫자는 이전 리포트 " + prevN + "개 중 등장한 횟수", repeat, period);
  }

  renderList(document.getElementById("panel-daily"), daily, "daily");
  renderList(document.getElementById("panel-weekly"), weekly, "weekly");

  const tabs = [document.getElementById("tab-daily"), document.getElementById("tab-weekly")];
  const panels = [document.getElementById("panel-daily"), document.getElementById("panel-weekly")];

  function selectTab(i, focus) {
    tabs.forEach((tab, j) => {
      tab.setAttribute("aria-selected", String(i === j));
      tab.tabIndex = i === j ? 0 : -1;
      panels[j].hidden = i !== j;
    });
    if (focus) tabs[i].focus();
  }
  tabs.forEach((tab, i) => {
    tab.addEventListener("click", () => selectTab(i));
    tab.addEventListener("keydown", e => {
      const to = { ArrowRight: i + 1, ArrowLeft: i - 1, Home: 0, End: tabs.length - 1 }[e.key];
      if (to === undefined) return;
      e.preventDefault();
      selectTab((to + tabs.length) % tabs.length, true);
    });
  });
</script>
